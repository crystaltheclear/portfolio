:root{
  color-scheme:light;
  --bg:#ffffff;
  --ink:#000000;
  --ink-soft:#070707;
  --muted:#c7c7c7;
  --panel:#d9d9d9;
  --violet:#9747ff;
  --violet-soft:#e6d3ff;
  --on-dark:#ffffff;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  /* 96px at 1440 wide, floor 40px */
  /* home type scales with the smaller of width and height so the whole home screen fits one viewport */
  --display:clamp(28px,min(6.667vw,9.2dvh),96px);
  /* 48px at 1440 wide, floor 26px */
  --about:clamp(26px,3.333vw,48px);
  /* 24px small pills, floor 16px */
  --small:clamp(16px,1.667vw,24px);
  --gutter:clamp(16px,2.222vw,32px);
  --tile:clamp(240px,35.42vw,510px);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;margin:0}
a,button{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:4px}

.screen{min-height:100dvh;animation:fade .35s ease both}
.screen[hidden]{display:none!important}
@keyframes fade{from{opacity:.001}to{opacity:1}}

/* ---------- Pills (Figma components Frame 1 / 6 / 7) ---------- */
.pill{
  display:inline-grid;place-items:center;
  border:var(--bw) solid var(--ink);border-radius:100px;
  background:var(--bg);color:var(--ink);text-decoration:none;
  white-space:nowrap;line-height:1.2;
  transition:background-color .2s ease,color .2s ease;
}
.pill > span{grid-area:1/1}
.pill .alt{visibility:hidden}
.pill.big{--bw:clamp(3px,.347vw,5px);font-size:var(--display);padding:.208em .625em}
.pill.small{--bw:clamp(2px,.208vw,3px);font-size:var(--small);padding:.833em 2.5em}
.pill.static{cursor:default}
@media (hover:hover){
  .pill:hover{background:var(--ink);color:var(--on-dark)}
  .pill:hover .main{visibility:hidden}
  .pill:hover .alt{visibility:visible}
  .pill.big .alt{font-size:inherit}
}
.pill:active{background:var(--ink);color:var(--on-dark)}

/* ---------- Home (Main 1:3) ---------- */
#home{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:clamp(24px,min(5.49vw,7.7dvh),79px) var(--gutter) clamp(20px,min(4.5vw,6.3dvh),65px)}

.line{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(10px,1.8vw,26px);min-width:0}
.line p{margin:0}
.grey{color:var(--muted)}
.roles{justify-content:flex-start;max-width:1375px;row-gap:clamp(12px,1.667vw,24px)}

/* ---------- About (1:143 → 1:254) ---------- */
#about{display:grid;grid-template-columns:minmax(0,738fr) minmax(0,702fr)}
.about-left{position:relative;padding:clamp(24px,2.64vw,38px) var(--gutter) 64px clamp(16px,3.06vw,44px);min-width:0}
.back{display:block;width:clamp(56px,5.49vw,79px);height:auto;aspect-ratio:1;border-radius:50%}
.back img{display:block;width:100%;height:100%}
.story{display:flex;flex-direction:column;gap:12px;margin-top:clamp(40px,4.03vw,58px);padding-left:5px;font-size:var(--about);font-weight:600;line-height:1.2}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-width:0}
.row.stack{flex-direction:column;align-items:flex-start}
.row p{margin:0;color:var(--ink)}
.row.last p{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;padding:8px 12px;background:var(--violet-soft);color:var(--on-dark);white-space:nowrap;cursor:default;transition:background-color .25s ease}
.chip.active{background:var(--violet);cursor:pointer}
.chip.active:hover{filter:brightness(1.08)}
.row.enter{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.about-panel{background:var(--panel);min-height:100dvh}

/* ---------- Works (Design 1:95) ---------- */
#works{padding:clamp(24px,3.47vw,50px) 0 clamp(48px,6.5vw,94px)}
#works .back{margin-left:clamp(16px,4.51vw,65px)}
.sections{display:flex;flex-direction:column;gap:clamp(48px,6.5vw,94px);margin-top:clamp(48px,6.5vw,94px)}
.section{display:flex;flex-direction:column;gap:clamp(24px,3.33vw,48px);min-width:0}
.section > .pill{align-self:flex-start;margin-left:clamp(16px,4.51vw,65px)}
.tiles{display:flex;gap:clamp(14px,3.125vw,45px);overflow-x:auto;scroll-snap-type:x mandatory;
  padding:0 clamp(16px,4.51vw,65px);scroll-padding:0 clamp(16px,4.51vw,65px);scrollbar-width:thin;overscroll-behavior-x:contain}
.tiles img{flex:none;display:block;width:var(--tile);height:var(--tile);max-width:none;object-fit:cover;scroll-snap-align:start}
.tiles img.wah{width:calc(var(--tile) * 512 / 510)}

/* ---------- Tablet & phone ---------- */
@media (max-width:900px){
  #about{grid-template-columns:1fr}
  .about-panel{min-height:0;height:40vh}
}
@media (max-width:600px){

  .socials{justify-content:flex-start;padding-right:0;flex-wrap:nowrap;gap:10px}

  :root{--display:clamp(28px,min(10.5vw,5.2dvh),48px)}
}
@media (prefers-reduced-motion:reduce){
  .screen,.row.enter{animation:none}
  .pill,.chip{transition:none}
}

<script>
(() => {
  // Fill these in to make the contact pills work.
  const LINKS = { linkedin: "", email: "", instagram: "" };
  const CREATOR_URL = ""; // e.g. your Instagram, for the "Content Creator" pill

  // About: each step reveals one more line; the purple chip advances.
  const STEPS = [
    { lead: "Hello! My name is", chip: "Crystal" },
    { lead: "I want to be a", chip: "lifelong learner", stack: true },
    { lead: "I really like to", chip: "travel" },
    { lead: "Also I like to learn", chip: "languages" },
    { lead: "Before we go back to", chip: "home", last: true }
  ];
  let step = 1;
  const story = document.getElementById("story");

  function renderStory(animateLast) {
    story.innerHTML = "";
    STEPS.slice(0, step).forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "row" + (s.stack ? " stack" : "") + (s.last ? " last" : "");
      if (animateLast && i === step - 1) row.classList.add("enter");
      const p = document.createElement("p");
      p.textContent = s.lead;
      const isActive = i === step - 1;
      const chip = document.createElement(isActive ? "button" : "span");
      chip.className = "chip" + (isActive ? " active" : "");
      chip.textContent = s.chip;
      if (isActive) chip.addEventListener("click", advance);
      row.append(p, chip);
      story.append(row);
    });
  }
  function advance() {
    if (step >= STEPS.length) { location.hash = "home"; return; }
    step++;
    renderStory(true);
    story.querySelector(".chip.active")?.focus({ preventScroll: true });
  }
  document.getElementById("about-back").addEventListener("click", () => {
    if (step > 1) { step--; renderStory(false); } else { location.hash = "home"; }
  });

  // Routing
  const screens = [...document.querySelectorAll(".screen")];
  function route() {
    const name = (location.hash || "#home").slice(1);
    const target = ["home", "about", "works"].includes(name) ? name : "home";
    if (target === "about") { step = 1; renderStory(false); }
    screens.forEach(s => { s.hidden = s.dataset.screen !== target; });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();

  // Contact pills
  document.querySelectorAll("[data-link]").forEach(a => {
    const url = LINKS[a.dataset.link];
    if (url) { a.href = a.dataset.link === "email" && !url.startsWith("mailto:") ? "mailto:" + url : url; a.target = "_blank"; a.rel = "noopener"; }
    else a.addEventListener("click", e => e.preventDefault());
  });
  const creator = document.getElementById("creator");
  if (CREATOR_URL) { creator.href = CREATOR_URL; creator.target = "_blank"; creator.rel = "noopener"; }
  else creator.addEventListener("click", e => e.preventDefault());
})();
</script>
