:root{
  color-scheme:light;
  --bg:#ffffff;
  --ink:#000000;
  --ink-soft:#070707;
  --muted:#c7c7c7;
  --panel:#d9d9d9;
  --chip-active:#363636;
  --chip-done:#cccccc;
  --focus:#9747ff;
  --on-dark:#ffffff;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  /* 96px at 1440 wide, floor 40px */
  /* home type scales with the smaller of width and height so the whole home screen fits one viewport */
  --display:clamp(28px,min(6.667vw,9.2dvh),96px);
  /* 48px at 1440 wide, floor 26px */
  --about:clamp(26px,3.333vw,48px);
  /* 24px small pills, floor 16px */
  --small:clamp(16px,1.667vw,24px);
  --gutter:clamp(16px,2.222vw,32px);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-weight:400;-webkit-font-smoothing:antialiased;margin:0}
a,button{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}

.screen{min-height:100dvh;animation:fade .35s ease both}
.screen[hidden]{display:none!important}
@keyframes fade{from{opacity:.001}to{opacity:1}}

/* ---------- Pills (Figma components Frame 1 / 6 / 7) ---------- */
.pill{
  display:inline-grid;place-items:center;
  border:var(--bw) solid var(--ink);border-radius:100px;
  background:var(--bg);color:var(--ink);text-decoration:none;
  white-space:nowrap;line-height:1.2;
  transition:background-color .2s ease,color .2s ease;
}
.pill > span{grid-area:1/1}
.pill .alt{visibility:hidden}
.pill.big{--bw:clamp(3px,.347vw,5px);font-size:var(--display);padding:.208em .625em}
.pill.small{--bw:clamp(2px,.208vw,3px);font-size:var(--small);padding:.833em 2.5em}
.pill.static{cursor:default}
@media (hover:hover){
  .pill:hover{background:var(--ink);color:var(--on-dark)}
  .pill.swap:hover .main{visibility:hidden}
  .pill.swap:hover .alt{visibility:visible}
  .pill.big .alt{font-size:inherit}
}
.pill:active,.pill:focus-visible{background:var(--ink);color:var(--on-dark)}

/* ---------- Home (Main 1:3) ---------- */
#home{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:clamp(24px,min(8.4vw,11.8dvh),121px) var(--gutter) clamp(20px,min(5.2vw,7.3dvh),75px)}
.lines{display:flex;flex-direction:column;gap:clamp(8px,min(1.11vw,1.56dvh),16px);font-size:var(--display);line-height:1.2}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(10px,1.8vw,26px);min-width:0}
.line p{margin:0}
.grey{color:var(--muted)}
.roles{justify-content:flex-start;max-width:1375px;row-gap:clamp(12px,1.667vw,24px)}
.roles.line{gap:clamp(12px,2.6vw,38px)}
.socials{margin-top:auto;padding-top:clamp(16px,3dvh,48px);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:clamp(10px,1.39vw,20px)}

/* ---------- About (1:143 → 1:254) ---------- */
#about{display:grid;grid-template-columns:minmax(0,738fr) minmax(0,702fr)}
.about-left{position:relative;padding:clamp(24px,2.64vw,38px) var(--gutter) 64px clamp(16px,3.06vw,44px);min-width:0}
.back{display:block;width:clamp(56px,5.49vw,79px);height:auto;aspect-ratio:1;border-radius:50%}
.back img{display:block;width:100%;height:100%}
.story{display:flex;flex-direction:column;gap:12px;margin-top:clamp(40px,4.03vw,58px);padding-left:5px;font-size:var(--about);font-weight:600;line-height:1.2}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-width:0}
.row.stack{flex-direction:column;align-items:flex-start}
.row p{margin:0;color:var(--ink)}
.row.last p{color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;padding:8px 12px;background:var(--chip-done);color:var(--on-dark);white-space:nowrap;cursor:default;transition:background-color .25s ease}
.chip.active{background:var(--chip-active);cursor:pointer}
.chip.active:hover{background:var(--ink)}
.row.enter{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.about-panel{background:var(--panel);min-height:100dvh}

/* ---------- Works (Design 1:95): category tabs, project list, image column ---------- */
#works,#content{padding:clamp(24px,3.47vw,50px) var(--gutter) clamp(48px,6.5vw,94px) clamp(16px,4.51vw,65px)}
.tabs-wrap{overflow-x:auto;scrollbar-width:none;margin:clamp(28px,3.61vw,52px) calc(-1 * var(--gutter)) 0 calc(-1 * clamp(16px,4.51vw,65px));padding:3px var(--gutter) 3px clamp(16px,4.51vw,65px)}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:16px;width:max-content;margin-inline:auto}
.tab[aria-selected="true"]{background:var(--ink);color:var(--on-dark)}
.works-grid{display:grid;grid-template-columns:minmax(0,631fr) minmax(0,621fr);gap:clamp(24px,3.26vw,47px);max-width:1299px;margin-top:clamp(24px,3.47vw,50px)}
.projects{list-style:none;margin:0;padding:0;align-self:start;font-size:var(--small);min-width:0}
.project{display:flex;align-items:baseline;gap:16px;width:100%;padding:16px 12px;border-bottom:1px solid var(--ink);text-align:left;line-height:1.2;transition:background-color .15s ease,color .15s ease}
.project .date{flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.project .name{min-width:0;word-break:keep-all}
.project[aria-current="true"]{background:var(--ink);color:var(--on-dark);border-bottom-color:var(--ink)}
@media (hover:hover){.project:hover{background:var(--ink);color:var(--on-dark)}}
.shots{display:flex;flex-direction:column;min-width:0}
.shot{display:block;width:100%;max-width:100%;aspect-ratio:1;background:var(--panel);overflow:hidden}
.shot img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
@media (hover:hover){.shot:hover img{transform:scale(1.02)}}
a.project{color:inherit;text-decoration:none}

/* ---------- Project detail (Design_detail 13:72) ---------- */
#detail{padding:clamp(24px,3.47vw,50px) var(--gutter) clamp(48px,6.5vw,94px) clamp(16px,4.3vw,62px)}
.detail-head{display:flex;align-items:center;gap:clamp(16px,3.4vw,49px);padding-left:3px}
.detail-title{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:16px 12px;font-size:var(--small);font-weight:400;line-height:1.2;min-width:0;word-break:keep-all}
.detail-title .date{font-variant-numeric:tabular-nums;white-space:nowrap}
.detail-shots{display:flex;flex-direction:column;gap:clamp(16px,3.2vw,46px);max-width:1317px;margin-top:clamp(28px,3.2vw,46px)}
.detail-shot{width:100%;max-width:100%}
.detail-shot.placeholder{aspect-ratio:1317/621;background:var(--panel)}
.detail-shot img{display:block;max-width:100%;max-height:90vh;width:auto;height:auto}
/* Image save deterrent: no drag, no long-press "Save Image", right-click hits the frame instead of the image */
.shot img,.detail-shot img{pointer-events:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.shot,.detail-shot{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.empty{margin:0;padding:16px 12px;border-bottom:1px solid var(--ink);font-size:var(--small);color:#6b6b6b}

/* ---------- Tablet & phone ---------- */
@media (max-width:900px){
  #about{grid-template-columns:1fr}
  .works-grid{grid-template-columns:1fr}
  .tabs{margin-inline:0}
  .shots{margin-top:0}
  .about-panel{min-height:0;height:40vh}
}
@media (max-width:600px){
  .roles{justify-content:flex-start}
  .socials{justify-content:flex-start;padding-right:0;flex-wrap:nowrap;gap:10px}
  .pill.small{padding:.8em 1.4em}
  :root{--display:clamp(28px,min(10.5vw,5.2dvh),48px)}
}
@media (prefers-reduced-motion:reduce){
  .screen,.row.enter{animation:none}
  .pill,.chip{transition:none}
}
</style>

<script>
(() => {
  // Fill these in to make the contact pills work.
  const LINKS = { linkedin: "", email: "", instagram: "" };

  // About: each step reveals one more line; the purple chip advances.
  const STEPS = [
    { lead: "Hello! My name is", chip: "Crystal" },
    { lead: "I want to be a", chip: "lifelong learner", stack: true },
    { lead: "I really like to", chip: "travel" },
    { lead: "Also I like to learn", chip: "languages" },
    { lead: "Before we go back to", chip: "home", last: true }
  ];
  let step = 1;
  const story = document.getElementById("story");

  function renderStory(animateLast) {
    story.innerHTML = "";
    STEPS.slice(0, step).forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "row" + (s.stack ? " stack" : "") + (s.last ? " last" : "");
      if (animateLast && i === step - 1) row.classList.add("enter");
      const p = document.createElement("p");
      p.textContent = s.lead;
      const isActive = i === step - 1;
      const chip = document.createElement(isActive ? "button" : "span");
      chip.className = "chip" + (isActive ? " active" : "");
      chip.textContent = s.chip;
      if (isActive) chip.addEventListener("click", advance);
      row.append(p, chip);
      story.append(row);
    });
  }
  function advance() {
    if (step >= STEPS.length) { location.hash = "home"; return; }
    step++;
    renderStory(true);
    story.querySelector(".chip.active")?.focus({ preventScroll: true });
  }
  document.getElementById("about-back").addEventListener("click", () => {
    if (step > 1) { step--; renderStory(false); } else { location.hash = "home"; }
  });

      { date: "2024.01 - 08", name: "주한미국대사관 계정 릴스", cover: null, images: [null, null, null, null] }
    ]},
    { key: "workshop", label: "Workshop", projects: [
      { date: "2026.08", name: "SNS 병아리반: 자신을 브랜딩하기", cover: null, images: [null, null, null, null] },
      { date: "2025.07", name: "인스타툰을 맛있게 그리는 비법: 짤 활용해서 그리기", cover: null, images: [null, null, null, null] }
    ]}
  ];
  const detailHash = (key, i) => "#work-" + key + "-" + i;
  function fillBox(el, src, alt) {
    el.innerHTML = "";
    if (src) { const img = document.createElement("img"); img.src = src; img.alt = alt; el.append(img); el.classList.remove("placeholder"); }
    else el.classList.add("placeholder");
  }
  function makeGallery(screenId, data) {
    const root = document.getElementById(screenId);
    const tabsEl = root.querySelector('[data-role="tabs"]'), listEl = root.querySelector('[data-role="projects"]'), shotsEl = root.querySelector('[data-role="shots"]');
    const g = { id: screenId, data, cat: 0, preview: 0 };
    function renderPreview() {
      const c = data[g.cat]; shotsEl.innerHTML = "";
      if (!c.projects.length) return;
      const p = c.projects[g.preview];
      const a = document.createElement("a");
      a.className = "shot"; a.href = detailHash(c.key, g.preview); a.setAttribute("aria-label", p.name + " 자세히 보기");
      fillBox(a, p.cover, p.name);
      shotsEl.append(a);
    }
    g.render = function () {
      tabsEl.innerHTML = "";
      data.forEach((c, i) => {
        const b = document.createElement("button");
        b.className = "pill small tab"; b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", i === g.cat ? "true" : "false");
        b.innerHTML = '<span class="main"></span>'; b.firstChild.textContent = c.label;
        b.addEventListener("click", () => { g.cat = i; g.preview = 0; g.render(); });
        tabsEl.append(b);
      });
      const c = data[g.cat];
      listEl.innerHTML = "";
      if (!c.projects.length) {
        const li = document.createElement("li"); li.className = "empty"; li.textContent = "작업을 준비하고 있어요.";
        listEl.append(li);
      }
      c.projects.forEach((p, i) => {
        const li = document.createElement("li"), a = document.createElement("a");
        a.className = "project"; a.href = detailHash(c.key, i);
        if (p.date) { const d = document.createElement("span"); d.className = "date"; d.textContent = p.date; a.append(d); }
        const n = document.createElement("span"); n.className = "name"; n.textContent = p.name; a.append(n);
        const show = () => { if (g.preview !== i) { g.preview = i; renderPreview(); } };
        a.addEventListener("mouseenter", show); a.addEventListener("focus", show);
        li.append(a); listEl.append(li);
      });
      renderPreview();
    };
    return g;
  }
  const GALLERIES = [makeGallery("works", WORKS), makeGallery("content", CONTENT)];

  // Project detail (Design_detail 13:72)
  const detailTitle = document.getElementById("detail-title"), detailShots = document.getElementById("detail-shots");
  const detailBack = document.querySelector("#detail .back");
  function renderDetail(g, c, i) {
    const p = g.data[c].projects[i];
    detailBack.href = "#" + g.id;
    detailTitle.innerHTML = "";
    if (p.date) { const d = document.createElement("span"); d.className = "date"; d.textContent = p.date; detailTitle.append(d); }
    const n = document.createElement("span"); n.textContent = p.name; detailTitle.append(n);
    detailShots.innerHTML = "";
    p.images.forEach(src => {
      const f = document.createElement("div"); f.className = "detail-shot";
      fillBox(f, src, p.name);
      detailShots.append(f);
    });
  }

  // Routing
  const screens = [...document.querySelectorAll(".screen")];
  let current = "";
  function route() {
    const name = (location.hash || "#home").slice(1);
    let target = ["home", "about", "works", "content"].includes(name) ? name : "home";
    const m = name.match(/^work-([a-z]+)-(\d+)$/);
    if (m) {
      for (const g of GALLERIES) {
        const c = g.data.findIndex(w => w.key === m[1]), i = +m[2];
        if (c >= 0 && g.data[c].projects[i]) { g.cat = c; g.preview = i; renderDetail(g, c, i); target = "detail"; break; }
      }
    }
    if (target === "about") { step = 1; renderStory(false); }
    // coming back from a detail page keeps the tab you were on
    const g = GALLERIES.find(x => x.id === target);
    if (g) { if (current !== "detail") { g.cat = 0; g.preview = 0; } g.render(); }
    screens.forEach(s => { s.hidden = s.dataset.screen !== target; });
    current = target;
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();

  // Block the context menu and dragging on work images
  document.addEventListener("contextmenu", e => { if (e.target.closest(".shot, .detail-shot")) e.preventDefault(); });
  document.addEventListener("dragstart", e => { if (e.target.closest(".shot, .detail-shot")) e.preventDefault(); });

  // Block the Save Page shortcut (⌘S / Ctrl+S). The browser menu can still save the page.
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S")) e.preventDefault();
  });

  // Contact pills
  document.querySelectorAll("[data-link]").forEach(a => {
    const url = LINKS[a.dataset.link];
    if (url) { a.href = a.dataset.link === "email" && !url.startsWith("mailto:") ? "mailto:" + url : url; a.target = "_blank"; a.rel = "noopener"; }
    else a.addEventListener("click", e => e.preventDefault());
  });
})();
</script>
